[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-trajectory-workbench"
version = "0.1.0"
description = "Local browser for MoH agent trajectories"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
trajectory-workbench = "trajectory_workbench.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trajectory_workbench = ["web/*"]

