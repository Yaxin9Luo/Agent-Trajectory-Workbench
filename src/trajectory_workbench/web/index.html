<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trajectory Workbench</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="library">
      <header class="brand">
        <span class="brand-mark">AT</span>
        <div><strong>Trajectory Workbench</strong><small data-i18n>查看 · 分析 · 对比 agent 轨迹</small></div>
      </header>

      <nav class="main-nav" aria-label="主导航" data-i18n-attrs="aria-label">
        <a href="#/library" data-nav="library" data-i18n>轨迹库</a>
        <a href="#/compare" data-nav="compare"><span data-i18n>对比</span> <span id="compare-count" class="nav-count"></span></a>
        <a href="#/rewrites" data-nav="rewrites" data-i18n>改写审阅</a>
        <a href="#/search" data-nav="search" data-i18n>搜索</a>
        <a href="#/explore" data-nav="explore" data-i18n>工具与报错</a>
        <a href="#/stats" data-nav="stats" data-i18n>统计</a>
        <a href="#/queue" data-nav="queue" data-i18n>每日练习</a>
      </nav>

      <label class="blind-toggle">
        <input id="blind-mode" type="checkbox">
        <span><b data-i18n>盲判模式</b><small data-i18n>练习用：先猜结果再看评分</small></span>
      </label>

      <div id="language-switch" class="language-switch" role="group" aria-label="界面语言" data-i18n-attrs="aria-label"></div>

      <div class="library-head">
        <span>Collections</span>
        <button id="refresh-collections" class="quiet-button" type="button" data-i18n>刷新</button>
      </div>
      <nav id="collection-list" class="run-list" aria-label="集合" data-i18n-attrs="aria-label"></nav>

      <form id="import-form" class="import-form">
        <label for="import-path" data-i18n>导入轨迹（文件或目录）</label>
        <input id="import-path" aria-label="绝对路径" data-i18n-attrs="aria-label" placeholder="/abs/path — Claude Code / Codex / ATIF / SFT / TraceLab / MoH" required>
        <input id="import-collection" aria-label="集合名" placeholder="集合名（可选，如 ckpt-500）" data-i18n-attrs="aria-label placeholder">
        <button type="submit" data-i18n>导入</button>
        <p id="import-status" role="status"></p>
      </form>
      <footer data-i18n>只索引路径，不复制或修改源文件</footer>
    </aside>

    <main id="view" class="workspace"></main>
  </div>

  <div id="image-modal" class="image-modal hidden" role="dialog" aria-modal="true" aria-label="图片大图" data-i18n-attrs="aria-label">
    <button type="button" aria-label="关闭图片" data-i18n-attrs="aria-label">×</button>
    <img alt="">
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
