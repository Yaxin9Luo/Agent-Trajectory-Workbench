<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trajectory Workbench</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="library">
      <header class="brand">
        <span class="brand-mark">AT</span>
        <div><strong>Trajectory Workbench</strong><small>查看 · 分析 · 对比 agent 轨迹</small></div>
      </header>

      <nav class="main-nav" aria-label="主导航">
        <a href="#/library" data-nav="library">轨迹库</a>
        <a href="#/compare" data-nav="compare">对比 <span id="compare-count" class="nav-count"></span></a>
        <a href="#/search" data-nav="search">搜索</a>
        <a href="#/explore" data-nav="explore">工具与报错</a>
        <a href="#/stats" data-nav="stats">统计</a>
        <a href="#/queue" data-nav="queue">每日练习</a>
      </nav>

      <label class="blind-toggle">
        <input id="blind-mode" type="checkbox">
        <span><b>盲判模式</b><small>练习用：先猜结果再看评分</small></span>
      </label>

      <div class="library-head">
        <span>Collections</span>
        <button id="refresh-collections" class="quiet-button" type="button">刷新</button>
      </div>
      <nav id="collection-list" class="run-list" aria-label="集合"></nav>

      <form id="import-form" class="import-form">
        <label for="import-path">导入轨迹（文件或目录）</label>
        <input id="import-path" aria-label="绝对路径" placeholder="/abs/path — Claude Code / Codex / ATIF / SFT / TraceLab / MoH" required>
        <input id="import-collection" aria-label="集合名" placeholder="集合名（可选，如 ckpt-500）">
        <button type="submit">导入</button>
        <p id="import-status" role="status"></p>
      </form>
      <footer>只索引路径，不复制或修改源文件</footer>
    </aside>

    <main id="view" class="workspace"></main>
  </div>

  <div id="image-modal" class="image-modal hidden" role="dialog" aria-modal="true" aria-label="图片大图">
    <button type="button" aria-label="关闭图片">×</button>
    <img alt="">
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
